#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_3p_AI_Arena
    name= _ "👑 Grand Strategy WorldBox Arena v8.1 — True War & Galloping Envoys"
    description= _ "Dokunulmaz Kraliyet Elçileri, Eve Tam Dönüş, Savaş Algılama ve Otomatik Topyekün Savaş."
    map_file=multiplayer/maps/2p_Grand_Empire_v3.map
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    # ── Side 1: OpenAI (İmparatorluk) ────────────────────────────────
    [side]
        side=1
        controller=human
        canrecruit=yes
        team_name=OpenAI_Kingdom
        user_team_name= _ "OpenAI (GPT-4o)"
        color=blue
        type="General"
        id="OpenAI_Leader"
        name="GPT-4o İmparatorluğu"
        recruit="Peasant,Spearman,Bowman,Horseman,Mage,Heavy Infantryman,Shock Trooper,Dwarvish Dragonguard,Thief,Goblin Spearman"
        gold=350
        income=8
        fog=no
        shroud=no
    [/side]

    # ── Side 2: DeepSeek (Kadim Orman) ──────────────────────────────
    [side]
        side=2
        controller=human
        canrecruit=yes
        team_name=DeepSeek_Kingdom
        user_team_name= _ "DeepSeek"
        color=red
        type="Elvish Marshal"
        id="DeepSeek_Leader"
        name="DeepSeek Orman Krallığı"
        recruit="Peasant,Elvish Fighter,Elvish Archer,Elvish Scout,Elvish Shaman,Elvish Ranger,Elvish Marksman,Troll Rocklobber,Thief,Goblin Spearman"
        gold=350
        income=8
        fog=no
        shroud=no
    [/side]

    # ── Side 3: Vahşi Barbar Klanı (Görünür & Canlı Muhafızlar) ──────
    [side]
        side=3
        controller=ai
        allow_player=no
        no_leader=yes
        team_name=Barbarians
        user_team_name= _ "Vahşi Barbarlar"
        color=black
        hidden=no
        gold=0
        income=-2
        [ai]
            ai_algorithm=idle_ai
        [/ai]
    [/side]

    [event]
        name=start
        [lua]
            code = <<
                local _G        = _G
                local pcall     = pcall
                local ipairs    = ipairs
                local wesnoth   = rawget(_G, "wesnoth")

                -- 1. FİZİKSEL 5 BARBAR MUHAFIZINI YERLEŞTİR
                local barbar_spawns = {
                    {x=6,  y=18, type="Orcish Grunt",    name="Barbar Balta Muhafızı"},
                    {x=10, y=22, type="Goblin Pillager", name="Yağmacı Kurt Süvarisi"},
                    {x=5,  y=26, type="Troll Whelp",     name="Kaya Trolü Muhafızı"},
                    {x=11, y=29, type="Orcish Archer",   name="Zehirli Okçu Muhafızı"},
                    {x=6,  y=32, type="Orcish Warrior",  name="Vahşi Barbar Şefi"}
                }
                for _, b in ipairs(barbar_spawns) do
                    pcall(function()
                        wesnoth.wml_actions.unit({
                            side = 3,
                            type = b.type,
                            x = b.x,
                            y = b.y,
                            name = b.name,
                            moves = 0
                        })
                        wesnoth.interface.float_label(b.x, b.y, "<span foreground='#ff6b6b'>💀 BARBAR MUHAFIZ</span>")
                    end)
                end
                wesnoth.interface.add_chat_message("🌍 DÜNYA", "Batı Badlands topraklarında 5 Barbar Köyü ve muhafızları belirdi!")
            >>
        [/lua]
    [/event]

    [event]
        name=prestart
        [lua]
            code = <<
                local _G        = _G
                local rawget    = rawget
                local tostring  = tostring
                local pcall     = pcall
                local ipairs    = ipairs
                local pairs     = pairs
                local type      = type
                local math      = rawget(_G, "math")
                local string    = rawget(_G, "string")
                local table     = rawget(_G, "table")
                local wesnoth   = rawget(_G, "wesnoth")
                local filesystem = rawget(_G, "filesystem")

                local SIDE_CFG = {
                    [1] = {
                        name        = "OpenAI (GPT-4o)",
                        leader_id   = "OpenAI_Leader",
                        keep        = {x=30, y=4},
                        castles     = {{x=29,y=4},{x=31,y=4},{x=30,y=3},{x=30,y=5},{x=29,y=3},{x=31,y=3}},
                        port_pos    = {x=26, y=10},
                        water_spawn = {x=26, y=11},
                        ship_type   = "Galleon",
                        pirate_type = "Pirate Galleon",
                        envoy_id    = "OpenAI_Envoy",
                        envoy_type  = "Horseman",
                        default_recruit = "Heavy Infantryman",
                        build_pos   = {{x=29,y=5},{x=31,y=5},{x=30,y=6},{x=28,y=5},{x=32,y=5}}
                    },
                    [2] = {
                        name        = "DeepSeek",
                        leader_id   = "DeepSeek_Leader",
                        keep        = {x=31, y=41},
                        castles     = {{x=30,y=41},{x=32,y=41},{x=31,y=40},{x=31,y=42},{x=30,y=40},{x=32,y=40}},
                        port_pos    = {x=32, y=35},
                        water_spawn = {x=32, y=34},
                        ship_type   = "Transport Galleon",
                        pirate_type = "Pirate Galleon",
                        envoy_id    = "DeepSeek_Envoy",
                        envoy_type  = "Elvish Scout",
                        default_recruit = "Elvish Marksman",
                        build_pos   = {{x=30,y=40},{x=32,y=40},{x=31,y=39},{x=29,y=40},{x=33,y=40}}
                    }
                }

                local function is_boat(u)
                    if not u or not u.type then return false end
                    return string.find(u.type, "Galleon") or string.find(u.type, "Boat")
                end

                local function is_flying(u)
                    if not u or not u.type then return false end
                    return string.find(u.type, "Dragon")
                end

                local function is_walkable_for(u, x, y)
                    if not wesnoth.current or not wesnoth.current.map then return true end
                    local t = wesnoth.current.map[{x, y}]
                    if not t then return false end

                    if is_flying(u) then return true end

                    if is_boat(u) then
                        return string.find(t, "Wo") or string.find(t, "Ww")
                    else
                        if string.find(t, "Wo") then return false end
                        if string.find(t, "Ww") and not string.find(t, "Wwf") and not string.find(t, "Rp") then
                            return false
                        end
                        return true
                    end
                end

                local function read_orders_file(side_number)
                    if not filesystem or not filesystem.read_file then return nil end
                    local fname = string.format("multiplayer/scenarios/orders_side_%d.json", side_number)
                    local ok, content = pcall(filesystem.read_file, fname)
                    if ok and type(content) == "string" and #content > 5 then
                        return content
                    end
                    return nil
                end

                local function extract_field(json_str, key)
                    if not json_str then return nil end
                    local v = string.match(json_str, '"' .. key .. '"%s*:%s*"([^"]-)"')
                    if not v or v == "null" or v == "" then return nil end
                    return v
                end

                local function hex_dist(x1, y1, x2, y2)
                    if wesnoth.map and wesnoth.map.distance_between then
                        local ok, d = pcall(wesnoth.map.distance_between, x1, y1, x2, y2)
                        if ok and d then return d end
                    end
                    local dx = math.abs(x1 - x2)
                    local dy = math.abs(y1 - y2)
                    return math.max(dx, dy, math.floor((dx + dy) / 2))
                end

                local function find_free_castle(sn)
                    local cfg = SIDE_CFG[sn]
                    if not cfg then return nil, nil end
                    if not wesnoth.units.get(cfg.keep.x, cfg.keep.y) then
                        return cfg.keep.x, cfg.keep.y
                    end
                    for _, pos in ipairs(cfg.castles) do
                        if not wesnoth.units.get(pos.x, pos.y) then
                            return pos.x, pos.y
                        end
                    end
                    return nil, nil
                end

                function execute_ai_side_turn(side_number)
                    local cfg = SIDE_CFG[side_number]
                    if not cfg then return end

                    local other_side = (side_number == 1 and 2 or 1)
                    local other_cfg  = SIDE_CFG[other_side]

                    local turn      = wesnoth.current.turn
                    local side_name = cfg.name
                    local leader_id = cfg.leader_id

                    pcall(function() wesnoth.interface.scroll_to_hex(cfg.keep.x, cfg.keep.y) end)

                    local orders_content = read_orders_file(side_number)
                    local thought      = nil
                    local dip_msg      = nil
                    local proposal     = nil
                    local event_choice = nil
                    local envoy_phase  = nil

                    if orders_content then
                        thought      = extract_field(orders_content, "thought")
                        dip_msg      = extract_field(orders_content, "diplomatic_message")
                        proposal     = extract_field(orders_content, "proposal")
                        event_choice = extract_field(orders_content, "event_choice")
                        envoy_phase  = extract_field(orders_content, "envoy_phase")
                    end

                    if not thought or #thought < 3 then
                        thought = string.format("%s krallığını yönetiyor ve ordularını yönlendiriyor.", side_name)
                    end

                    -- 1. Chat & Floating Banners
                    pcall(function()
                        wesnoth.interface.add_chat_message(side_name, string.format("🧠 Strateji: %s", thought))
                        if proposal == "BETRAY_ATTACK" then
                            wesnoth.interface.add_chat_message("⚠️ İHANET", string.format("⚡ %s AKTİF PAKTI BOZARAK ANİDEN SALDIRDI!", side_name))
                            wesnoth.interface.float_label(cfg.keep.x, cfg.keep.y, "<span foreground='#FF0000' size='x-large'>⚠️ İHANET SALDIRISI!</span>")
                        end
                        if event_choice and event_choice ~= "null" and #event_choice >= 1 then
                            wesnoth.interface.add_chat_message("🎴 OLAY", string.format("%s Olay Kartında Seçenek [%s] kararını verdi.", side_name, event_choice))
                            wesnoth.interface.float_label(cfg.keep.x, cfg.keep.y, string.format("<span foreground='#FFA500'>🎴 SEÇENEK [%s]</span>", event_choice))
                        end
                    end)

                    pcall(function()
                        wesnoth.wml_actions.print({
                            text     = string.format("<span color='#FFD700'>%s (Tur %d):</span> %s", side_name, turn, thought),
                            size     = 16,
                            duration = 220,
                            red      = (side_number == 2 and 255 or 100),
                            green    = (side_number == 1 and 200 or 255),
                            blue     = (side_number == 1 and 255 or 100),
                        })
                    end)

                    -- 2. DOKUNULMAZ KRALİYET ELÇİSİ (Dört Nala Koşar, Saraya Varır ve Eve Döner!)
                    pcall(function()
                        local envoy = wesnoth.units.get(cfg.envoy_id)
                        local mid_x, mid_y = 29, 23  -- Merkez Ada Taş Köprüsü

                        -- A. YOLA ÇIKIŞ (DEPARTURE) -> Köprüye Hızla Koş
                        if envoy_phase == "DEPARTURE" then
                            if not envoy then
                                local start_x = cfg.keep.x + (side_number == 1 and 1 or -1)
                                local start_y = cfg.keep.y + (side_number == 1 and 2 or -2)
                                wesnoth.wml_actions.unit({
                                    id = cfg.envoy_id,
                                    side = side_number,
                                    type = cfg.envoy_type,
                                    x = start_x,
                                    y = start_y,
                                    name = "Kraliyet Baş Elçisi (Dokunulmaz)",
                                    moves = 14
                                })
                                envoy = wesnoth.units.get(cfg.envoy_id)
                            end
                            if envoy then
                                wesnoth.wml_actions.move_unit({id=cfg.envoy_id, to_x=mid_x, to_y=mid_y})
                                wesnoth.interface.float_label(mid_x, mid_y, "<span foreground='#FFD700' size='large'>🕊️ ELÇİ DÖRT NALA KOŞUYOR (Köprü Aşıldı)</span>")
                                wesnoth.interface.add_chat_message("🕊️ ELÇİ", string.format("%s Baş Elçisi dört nala karşı krallığa ilerliyor...", side_name))
                            end

                        -- B. VARIŞ VE MEKTUP TESLİMİ (ARRIVAL) -> Düşman Saray Kapısı
                        elseif envoy_phase == "ARRIVAL" and envoy then
                            local dest_x = other_cfg.keep.x
                            local dest_y = other_cfg.keep.y + (other_side == 1 and 2 or -2)
                            wesnoth.wml_actions.move_unit({id=cfg.envoy_id, to_x=dest_x, to_y=dest_y})
                            wesnoth.interface.float_label(dest_x, dest_y, "<span foreground='#00FF00' size='x-large'>📜 ELÇİ SARAYA VARDI! MEKTUP SUNULUYOR!</span>")
                            wesnoth.interface.add_chat_message("🕊️ DİPLOMASİ", string.format("%s Baş Elçisi %s sarayına vardı: [%s] %s", side_name, other_cfg.name, proposal or "MEKTUP", dip_msg or ""))

                        -- C. SARAYA DÖNÜŞ (RETURN) -> Kendi Sarayına Geri Girer!
                        elseif envoy_phase == "RETURN" and envoy then
                            wesnoth.wml_actions.move_unit({id=cfg.envoy_id, to_x=cfg.keep.x, to_y=cfg.keep.y + (side_number == 1 and 1 or -1)})
                            wesnoth.interface.float_label(cfg.keep.x, cfg.keep.y, "<span foreground='#38bdf8'>🕊️ ELÇİ SARAYINA GERİ DÖNDÜ</span>")
                            wesnoth.wml_actions.kill({id=cfg.envoy_id, animate=false})
                        end
                    end)

                    pcall(function() wesnoth.interface.delay(2600) end)

                    -- 3. SÜRPRİZ İHANET BASKINI MEKANİĞİ (BETRAY_ATTACK)
                    if proposal == "BETRAY_ATTACK" then
                        pcall(function()
                            local my_units = wesnoth.units.find_on_map({side=side_number})
                            local enemies  = wesnoth.units.find_on_map({side=other_side})
                            for _, u in ipairs(my_units) do
                                if u.id ~= leader_id and u.id ~= cfg.envoy_id and u.hitpoints > 0 then
                                    for _, e in ipairs(enemies) do
                                        local d = hex_dist(u.x, u.y, e.x, e.y)
                                        if d <= 5 then
                                            local hx = u.x + (e.x > u.x and 2 or (e.x < u.x and -2 or 0))
                                            local hy = u.y + (e.y > u.y and 2 or (e.y < u.y and -2 or 0))
                                            if is_walkable_for(u, hx, hy) and not wesnoth.units.get(hx, hy) then
                                                wesnoth.wml_actions.move_unit({id=u.id, to_x=hx, to_y=hy})
                                            end
                                            if hex_dist(u.x, u.y, e.x, e.y) <= 1 then
                                                e.hitpoints = e.hitpoints - 25
                                                wesnoth.interface.float_label(e.x, e.y, "<span foreground='red'>-25 HP 🗡️ SÜRPRİZ BASKIN</span>")
                                            end
                                            break
                                        end
                                    end
                                end
                            end
                        end)
                    end

                    -- 4. İNŞAAT: ÇİFTLİK, KIŞLA, MADEN, KALE, LİMAN
                    if orders_content and string.find(orders_content, '"BUILD"') then
                        pcall(function()
                            if string.find(orders_content, '"PORT"') then
                                wesnoth.wml_actions.terrain({ x = cfg.port_pos.x, y = cfg.port_pos.y, terrain = "Wwf^Vht" })
                                wesnoth.interface.float_label(cfg.port_pos.x, cfg.port_pos.y, "<span foreground='#00FFFF'>⚓ LİMAN & TERSANE KURULDU</span>")
                            else
                                local build_idx = (turn % #cfg.build_pos) + 1
                                local bpos = cfg.build_pos[build_idx]
                                if string.find(orders_content, '"FARM"') then
                                    wesnoth.wml_actions.terrain({ x = bpos.x, y = bpos.y, terrain = "Gs^Vht" })
                                    wesnoth.interface.float_label(bpos.x, bpos.y, "<span foreground='#7CFC00'>🌾 ÇİFTLİK KURULDU (+Erzak)</span>")
                                elseif string.find(orders_content, '"BARRACKS"') then
                                    wesnoth.wml_actions.terrain({ x = bpos.x, y = bpos.y, terrain = "Ce" })
                                    wesnoth.interface.float_label(bpos.x, bpos.y, "<span foreground='#FF4500'>⚔️ ASKERİ KIŞLA İNŞA EDİLDİ</span>")
                                elseif string.find(orders_content, '"FORT"') then
                                    wesnoth.wml_actions.terrain({ x = bpos.x, y = bpos.y, terrain = "Ce" })
                                    wesnoth.interface.float_label(bpos.x, bpos.y, "<span foreground='#00BFFF'>🏰 TAŞ KALE DİKİLDİ (%60 Zırh)</span>")
                                elseif string.find(orders_content, '"MINE"') then
                                    wesnoth.wml_actions.terrain({ x = bpos.x, y = bpos.y, terrain = "Mm^Vhh" })
                                    wesnoth.interface.float_label(bpos.x, bpos.y, "<span foreground='#FFD700'>⛏️ TAŞ & DEMİR MADENİ</span>")
                                end
                            end
                        end)
                    end

                    -- 5. ASKER, İŞÇİ, CASUS & GEMİ BASIMI
                    pcall(function()
                        local sd = wesnoth.sides.get(side_number)
                        if not sd or sd.gold < 10 then return end

                        if orders_content and (string.find(orders_content, '"PIRATE"') or string.find(orders_content, '"SHIP"')) then
                            if not wesnoth.units.get(cfg.water_spawn.x, cfg.water_spawn.y) then
                                local s_type = string.find(orders_content, '"PIRATE"') and cfg.pirate_type or cfg.ship_type
                                wesnoth.wml_actions.unit({
                                    side  = side_number,
                                    type  = s_type,
                                    x     = cfg.water_spawn.x,
                                    y     = cfg.water_spawn.y,
                                    moves = 8,
                                })
                                sd.gold = math.max(0, sd.gold - 30)
                                wesnoth.interface.float_label(cfg.water_spawn.x, cfg.water_spawn.y, "<span foreground='#00FFFF'>⚓ KALYON DENİZE İNDİRİLDİ</span>")
                                return
                            end
                        end

                        local recruit_type = cfg.default_recruit
                        local recruit_cost = 16

                        if orders_content then
                            if string.find(orders_content, '"WORKER"') or string.find(orders_content, '"PEASANT"') then
                                recruit_type = "Peasant"
                                recruit_cost = 10
                            elseif string.find(orders_content, '"SPY"') then
                                recruit_type = "Thief"
                                recruit_cost = 18
                            elseif string.find(orders_content, '"DRAGON"') then
                                recruit_type = "Fire Dragon"
                                recruit_cost = 100
                            elseif string.find(orders_content, '"SIEGE"') then
                                recruit_type = "Dwarvish Dragonguard"
                                recruit_cost = 45
                            elseif string.find(orders_content, '"TROLL"') then
                                recruit_type = "Troll Rocklobber"
                                recruit_cost = 40
                            elseif string.find(orders_content, '"GOBLIN"') then
                                recruit_type = "Goblin Spearman"
                                recruit_cost = 10
                            elseif string.find(orders_content, '"ARCHER"') then
                                recruit_type = (side_number == 1 and "Bowman" or "Elvish Archer")
                            elseif string.find(orders_content, '"CAVALRY"') then
                                recruit_type = (side_number == 1 and "Horseman" or "Elvish Scout")
                            elseif string.find(orders_content, '"MAGE"') then
                                recruit_type = (side_number == 1 and "Red Mage" or "Elvish Sorceress")
                            elseif string.find(orders_content, '"HEAVY"') then
                                recruit_type = (side_number == 1 and "Shock Trooper" or "Elvish Ranger")
                            end
                        end

                        local tx, ty = find_free_castle(side_number)
                        if tx and sd.gold >= recruit_cost then
                            wesnoth.wml_actions.unit({
                                side  = side_number,
                                type  = recruit_type,
                                x     = tx,
                                y     = ty,
                                moves = 5,
                            })
                            sd.gold = sd.gold - recruit_cost
                            if recruit_type == "Peasant" then
                                wesnoth.interface.float_label(tx, ty, "<span foreground='#84cc16'>👨‍🌾 İŞÇİ GÖREVE BAŞLADI</span>")
                            elseif recruit_type == "Thief" then
                                wesnoth.interface.float_label(tx, ty, "<span foreground='#9333ea'>🕵️ CASUS GÖREVE BAŞLADI</span>")
                            end
                        end
                    end)

                    -- 6. DOKUNULMAZ ELÇİ KORUMASI, SAVAŞ VE HAREKET
                    pcall(function()
                        local friendly = wesnoth.units.find_on_map({side=side_number})
                        local all      = wesnoth.units.find_on_map({})
                        local enemies  = {}

                        for _, e in ipairs(all) do
                            -- DİPLOMATİK DOKUNULMAZLIK: Elçilere ASLA saldırma!
                            local is_envoy = (e.id == "OpenAI_Envoy" or e.id == "DeepSeek_Envoy" or (e.name and string.find(e.name, "Elçi")))
                            if e.side ~= side_number and not is_envoy and e.hitpoints > 0 then
                                table.insert(enemies, e)
                            end
                        end

                        local center_relic = {x = 31, y = 24}

                        for _, u in ipairs(friendly) do
                            -- Elçi kendisi de savaşmaz, sadece diplomasi yapar
                            if u.id == leader_id or u.id == cfg.envoy_id or u.moves <= 0 or u.hitpoints <= 0 then goto skip_u end

                            -- İŞÇİ KÖYLÜ MEKANİĞİ
                            if u.type == "Peasant" then
                                local map_tile = wesnoth.current.map[{u.x, u.y}]
                                if map_tile and string.find(map_tile, "%^Ft") then
                                    wesnoth.interface.float_label(u.x, u.y, "<span foreground='#84cc16'>🌲 ODUN KESİYOR (+10)</span>")
                                elseif map_tile and (string.find(map_tile, "Hh") or string.find(map_tile, "Mm")) then
                                    wesnoth.interface.float_label(u.x, u.y, "<span foreground='#eab308'>⛏️ TAŞ TOPLUYOR (+10)</span>")
                                else
                                    local forest_y = (side_number == 1 and 6 or 38)
                                    local forest_x = u.x + (u.x % 2 == 0 and 1 or -1)
                                    if is_walkable_for(u, forest_x, forest_y) and not wesnoth.units.get(forest_x, forest_y) then
                                        wesnoth.wml_actions.move_unit({id=u.id, to_x=forest_x, to_y=forest_y})
                                    end
                                end
                                goto skip_u
                            end

                            -- Doğu Ticaret Koridoru (Cols 51-60)
                            if is_boat(u) and u.x >= 51 then
                                wesnoth.interface.float_label(u.x, u.y, "<span foreground='#FFD700'>⛵ +5g DOĞU TİCARETİ</span>")
                            end

                            local best_e, best_d = nil, 9999
                            for _, e in ipairs(enemies) do
                                if e.valid and e.hitpoints > 0 then
                                    local d = hex_dist(u.x, u.y, e.x, e.y)
                                    if d < best_d then
                                        best_d = d
                                        best_e = e
                                    end
                                end
                            end

                            -- Yakın Savaş (1 Hex)
                            if best_e and best_d <= 1 then
                                -- KRALLIKLAR ARASI SAVAŞ BAŞLADI ALARMI!
                                if best_e.side ~= 3 then
                                    wesnoth.interface.add_chat_message("🚨 SAVAŞ", string.format("%s orduları %s birliklerine saldırdı! TOPYEKÜN SAVAŞ BAŞLADI!", side_name, other_cfg.name))
                                    wesnoth.interface.float_label(best_e.x, best_e.y, "<span foreground='red' size='x-large'>🚨 SAVAŞ BAŞLADI!</span>")
                                end

                                local dmg = math.random(12, 22)
                                local icon = "⚔️"
                                if is_flying(u) then
                                    dmg = math.random(35, 52)
                                    icon = "🔥 EJDERHA ALEVİ"
                                elseif is_boat(u) then
                                    dmg = math.random(18, 30)
                                    icon = "💣 TOPÇU BORDALAMA"
                                elseif u.type == "Thief" then
                                    dmg = math.random(24, 38)
                                    icon = "🗡️ SIRTTAN BIÇAKLAMA"
                                end

                                best_e.hitpoints = best_e.hitpoints - dmg
                                wesnoth.interface.float_label(best_e.x, best_e.y, string.format("<span foreground='red'>-%d HP %s</span>", dmg, icon))

                                local ret_dmg = math.random(4, 12)
                                u.hitpoints = u.hitpoints - ret_dmg
                                wesnoth.interface.float_label(u.x, u.y, string.format("<span foreground='orange'>-%d HP</span>", ret_dmg))

                                if best_e.hitpoints <= 0 then
                                    if best_e.side == 3 then
                                        wesnoth.interface.add_chat_message("🏴‍☠️ BARBAR", string.format("%s Barbar Muhafızını yok etti ve köyü fethetti! (+15g/tur)", side_name))
                                        wesnoth.interface.float_label(best_e.x, best_e.y, "<span foreground='#FFD700'>🏴‍☠️ BARBAR KÖYÜ FETHEDİLDİ (+15g)</span>")
                                    else
                                        wesnoth.interface.add_chat_message("⚔️ Savaş", string.format("%s yok edildi!", best_e.type))
                                    end
                                    wesnoth.wml_actions.kill({ id = best_e.id, animate = true })
                                end
                                if u.hitpoints <= 0 then
                                    wesnoth.wml_actions.kill({ id = u.id, animate = true })
                                end

                            -- Menzilli Kuşatma / Kıyı Bombardımanı / Okçu Atışı (2-3 Hex)
                            elseif best_e and best_d <= 3 then
                                local dmg = 0
                                local icon = ""
                                if u.type == "Dwarvish Dragonguard" then
                                    dmg = math.random(30, 48)
                                    icon = "💥 KUŞATMA TOPU"
                                elseif u.type == "Troll Rocklobber" then
                                    dmg = math.random(18, 30)
                                    icon = "🪨 KAYA FIRLATMA"
                                elseif is_boat(u) and best_d <= 2 then
                                    dmg = math.random(14, 26)
                                    icon = "💥 KIYI BOMBARDIMANI"
                                elseif is_flying(u) and best_d <= 2 then
                                    dmg = math.random(25, 40)
                                    icon = "🔥 MENZİLLİ ALEV"
                                elseif best_d <= 2 then
                                    dmg = math.random(8, 16)
                                    icon = "🏹"
                                end

                                if dmg > 0 then
                                    best_e.hitpoints = best_e.hitpoints - dmg
                                    wesnoth.interface.float_label(best_e.x, best_e.y, string.format("<span foreground='yellow'>-%d %s</span>", dmg, icon))
                                    if best_e.hitpoints <= 0 then
                                        wesnoth.interface.add_chat_message("🏹 Menzilli Atış", string.format("%s düşürüldü!", best_e.type))
                                        wesnoth.wml_actions.kill({ id = best_e.id, animate = true })
                                    end
                                end
                            else
                                local target_x = center_relic.x
                                local target_y = center_relic.y
                                if u.type == "Thief" then
                                    target_x = other_cfg.keep.x
                                    target_y = other_cfg.keep.y
                                end

                                local dest_x = (best_e and best_e.x) or target_x
                                local dest_y = (best_e and best_e.y) or target_y
                                local dx = dest_x - u.x
                                local dy = dest_y - u.y
                                local sx = u.x + (dx > 0 and 1 or (dx < 0 and -1 or 0))
                                local sy = u.y + (dy > 0 and 1 or (dy < 0 and -1 or 0))

                                if sx >= 1 and sx <= 60 and sy >= 1 and sy <= 45 and is_walkable_for(u, sx, sy) and not wesnoth.units.get(sx, sy) then
                                    wesnoth.wml_actions.move_unit({id=u.id, to_x=sx, to_y=sy})
                                elseif sx >= 1 and sx <= 60 and is_walkable_for(u, sx, u.y) and not wesnoth.units.get(sx, u.y) then
                                    wesnoth.wml_actions.move_unit({id=u.id, to_x=sx, to_y=u.y})
                                elseif sy >= 1 and sy <= 45 and is_walkable_for(u, u.x, sy) and not wesnoth.units.get(u.x, sy) then
                                    wesnoth.wml_actions.move_unit({id=u.id, to_x=u.x, to_y=sy})
                                end
                            end
                            ::skip_u::
                        end
                    end)

                    pcall(function() wesnoth.wml_actions.end_turn({}) end)
                end
            >>
        [/lua]
    [/event]

    [event]
        name=side 1 turn
        first_time_only=no
        [lua]
            code = << execute_ai_side_turn(1) >>
        [/lua]
    [/event]

    [event]
        name=side 2 turn
        first_time_only=no
        [lua]
            code = << execute_ai_side_turn(2) >>
        [/lua]
    [/event]
[/multiplayer]
