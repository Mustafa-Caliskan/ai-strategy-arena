#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_AI_Benchmark_Arena
    name= _ "AI Benchmark Arena — OpenAI vs DeepSeek"
    description= _ "1v1 Tactical Intelligence Benchmark Arena pitting OpenAI (GPT-4o) against DeepSeek."
    map_file=multiplayer/maps/2p_Hamlets.map
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    # ── Side 1: OpenAI Kingdom ──────────────────────────────────────
    [side]
        side=1
        controller=ai
        canrecruit=yes
        team_name=OpenAI_Kingdom
        user_team_name= _ "OpenAI (GPT-4o)"
        type="Lieutenant"
        id="OpenAI_Leader"
        name="GPT-4o General"
        recruit="Spearman,Bowman,Horseman,Mage"
        gold=150
        income=2
        fog=no
        shroud=no
        [ai]
            villages_per_scout=8
        [/ai]
    [/side]

    # ── Side 2: DeepSeek Kingdom ────────────────────────────────────
    [side]
        side=2
        controller=ai
        canrecruit=yes
        team_name=DeepSeek_Kingdom
        user_team_name= _ "DeepSeek"
        type="Elvish Captain"
        id="DeepSeek_Leader"
        name="DeepSeek General"
        recruit="Elvish Fighter,Elvish Archer,Elvish Scout,Elvish Shaman"
        gold=150
        income=2
        fog=no
        shroud=no
        [ai]
            villages_per_scout=8
        [/ai]
    [/side]

    [lua]
        code = <<
            wesnoth.dofile("multiplayer/scenarios/2p_AI_Benchmark.lua")
        >>
    [/lua]
[/multiplayer]